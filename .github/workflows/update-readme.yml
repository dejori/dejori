name: Update README Stats

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8 AM UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get coding language stats
        id: github
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Get all repos for user
          REPOS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/user/repos?per_page=100&type=owner")

          # Aggregate language bytes across all repos
          declare -A LANG_BYTES
          TOTAL_BYTES=0

          for repo in $(echo "$REPOS" | jq -r '.[].full_name'); do
            LANGS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$repo/languages")

            for lang in $(echo "$LANGS" | jq -r 'keys[]'); do
              bytes=$(echo "$LANGS" | jq -r ".[\"$lang\"]")
              LANG_BYTES[$lang]=$((${LANG_BYTES[$lang]:-0} + bytes))
              TOTAL_BYTES=$((TOTAL_BYTES + bytes))
            done
          done

          # Sort languages by bytes and get top 3
          SORTED=$(for lang in "${!LANG_BYTES[@]}"; do
            echo "${LANG_BYTES[$lang]} $lang"
          done | sort -rn | head -3)

          # Calculate percentages and build bar chart
          BAR_WIDTH=20
          BAR=""
          LEGEND=""
          CHARS=("█" "░" "▒")
          i=0
          TOP3_BYTES=0

          while read -r bytes lang; do
            if [ -n "$bytes" ] && [ "$TOTAL_BYTES" -gt 0 ]; then
              TOP3_BYTES=$((TOP3_BYTES + bytes))
              pct=$((bytes * 100 / TOTAL_BYTES))
              chars=$((pct * BAR_WIDTH / 100))
              [ $chars -eq 0 ] && [ $pct -gt 0 ] && chars=1

              for ((j=0; j<chars; j++)); do
                BAR="${BAR}${CHARS[$i]}"
              done

              if [ -n "$LEGEND" ]; then
                LEGEND="${LEGEND} | "
              fi
              LEGEND="${LEGEND}${lang} ${pct}%"
              i=$((i + 1))
            fi
          done <<< "$SORTED"

          # Calculate and add "Other" if there's remaining percentage
          OTHER_BYTES=$((TOTAL_BYTES - TOP3_BYTES))
          if [ "$OTHER_BYTES" -gt 0 ] && [ "$TOTAL_BYTES" -gt 0 ]; then
            OTHER_PCT=$((OTHER_BYTES * 100 / TOTAL_BYTES))
            if [ "$OTHER_PCT" -gt 0 ]; then
              chars=$((OTHER_PCT * BAR_WIDTH / 100))
              [ $chars -eq 0 ] && chars=1
              for ((j=0; j<chars; j++)); do
                BAR="${BAR}·"
              done
              LEGEND="${LEGEND} | Other ${OTHER_PCT}%"
            fi
          fi

          # Fill remaining bar space if needed
          current_len=${#BAR}
          while [ $current_len -lt $BAR_WIDTH ]; do
            BAR="${BAR} "
            current_len=$((current_len + 1))
          done

          STATS="${BAR} ${LEGEND}"
          echo "language_stats=$STATS" >> $GITHUB_OUTPUT

      - name: Get latest Zotero paper
        id: zotero
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          # Get most recently added items (exclude attachments)
          ITEMS=$(curl -s \
            "https://api.zotero.org/users/$ZOTERO_USER_ID/items?sort=dateAdded&direction=desc&limit=5&itemType=-attachment&format=json" \
            -H "Zotero-API-Key: $ZOTERO_API_KEY")

          COUNT=$(echo "$ITEMS" | jq 'length')
          PAPER_TEXT=""

          for idx in $(seq 0 $((COUNT - 1))); do
            TITLE=$(echo "$ITEMS" | jq -r ".[$idx].data.title // empty")

            # Skip missing or corrupted titles (> 300 chars)
            if [ -z "$TITLE" ] || [ ${#TITLE} -gt 300 ]; then
              continue
            fi

            AUTHORS=$(echo "$ITEMS" | jq -r ".[$idx].data.creators | map(select(.creatorType==\"author\") | .lastName) | join(\", \")")
            YEAR=$(echo "$ITEMS" | jq -r ".[$idx].data.date // empty" | grep -oP '^\d{4}' || true)
            URL=$(echo "$ITEMS" | jq -r ".[$idx].data.url // empty")
            DOI=$(echo "$ITEMS" | jq -r ".[$idx].data.DOI // empty")
            EXTRA=$(echo "$ITEMS" | jq -r ".[$idx].data.extra // empty")
            ARXIV=$(echo "$EXTRA" | grep -oP 'arXiv:\K\S+' || true)

            # Pick best URL: url > DOI > arXiv
            if [ -z "$URL" ] || [ "$URL" == "null" ]; then
              if [ -n "$DOI" ] && [ "$DOI" != "null" ]; then
                URL="https://doi.org/$DOI"
              elif [ -n "$ARXIV" ]; then
                URL="https://arxiv.org/abs/$ARXIV"
              fi
            fi

            if [ -n "$YEAR" ]; then
              PAPER_TEXT="*${TITLE}* by ${AUTHORS} (${YEAR})"
            else
              PAPER_TEXT="*${TITLE}* by ${AUTHORS}"
            fi

            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              PAPER_TEXT="${PAPER_TEXT} [[ref]](${URL})"
            fi

            break
          done

          echo "paper_text=$PAPER_TEXT" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          STATS="${{ steps.github.outputs.language_stats }}"
          PAPER="${{ steps.zotero.outputs.paper_text }}"

          # Update language stats (use # as delimiter to avoid | conflicts)
          if [ -n "$STATS" ]; then
            SAFE_STATS=$(printf '%s' "$STATS" | sed 's#[&\\]#\\&#g')
            sed -i "s#<!-- LANG:START -->.*<!-- LANG:END -->#<!-- LANG:START -->${SAFE_STATS}<!-- LANG:END -->#" README.md
          fi

          # Update paper
          if [ -n "$PAPER" ]; then
            SAFE_PAPER=$(printf '%s' "$PAPER" | sed 's#[&\\]#\\&#g')
            sed -i "s#<!-- PAPER:START -->.*<!-- PAPER:END -->#<!-- PAPER:START -->${SAFE_PAPER}<!-- PAPER:END -->#" README.md
          fi

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet README.md || (git add README.md && git commit -m "Update README stats")
          git push
